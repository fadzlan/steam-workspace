name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  dist:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, script: dist:linux, name: linux }
          - { os: windows-latest, script: dist:win, name: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: steam-workspace-${{ matrix.name }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe

  release:
    if: github.event_name != 'pull_request'
    needs: dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Pick tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else echo "name=v$(node -p "require('./package.json').version")-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          prerelease: true
          generate_release_notes: true

  # Publishes steam-workspace-bin to the AUR over plain SSH (see packaging/aur/publish.sh).
  # Needs the repo secret AUR_SSH_PRIVATE_KEY; skipped when it is not set.
  aur:
    needs: release
    runs-on: ubuntu-latest
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: steam-workspace-linux
          path: artifacts
      - name: Publish to AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          sha=$(sha256sum artifacts/*.deb | cut -d' ' -f1)
          packaging/aur/publish.sh "${{ needs.release.outputs.tag }}" "$sha" "$GITHUB_RUN_NUMBER" --push

  # Builds the Arch package (.pkg.tar.zst) from packaging/aur/PKGBUILD and attaches it to the release.
  arch:
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
    steps:
      - run: pacman -Syu --noconfirm nodejs git
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: steam-workspace-linux
          path: artifacts
      - name: Build package
        run: |
          sha=$(sha256sum artifacts/*.deb | cut -d' ' -f1)
          packaging/aur/publish.sh "${{ needs.release.outputs.tag }}" "$sha" "$GITHUB_RUN_NUMBER"
          useradd -m builder
          chown -R builder packaging/aur
          su builder -c 'cd packaging/aur && makepkg -f --nodeps --noconfirm'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            packaging/aur/*.pkg.tar.zst
            packaging/aur/PKGBUILD
